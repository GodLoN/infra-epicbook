trigger: none

pr: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureServiceConnection: 'epicbook-azure'

steps:
  - checkout: self

  - task: TerraformInstaller@1
    displayName: 'Install Terraform'
    inputs:
      terraformVersion: '1.9.8'

  - task: DownloadSecureFile@1
    name: sshPublicKey
    displayName: 'Download SSH Public Key'
    inputs:
      secureFile: 'epicbook-ssh-public-key'

  - task: AzureCLI@2
    displayName: 'Terraform Init, Plan, Apply and Outputs'
    inputs:
      azureSubscription: '$(azureServiceConnection)'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      addSpnToEnvironment: true
      inlineScript: |
        set -euo pipefail

        echo "===== AZURE ACCOUNT ====="
        az account show \
          --query '{subscription:name, subscriptionId:id, tenantId:tenantId}' \
          --output table

        export ARM_CLIENT_ID="$servicePrincipalId"
        export ARM_CLIENT_SECRET="$servicePrincipalKey"
        export ARM_TENANT_ID="$tenantId"
        export ARM_SUBSCRIPTION_ID="$(az account show --query id --output tsv)"

        echo
        echo "===== TERRAFORM VERSION ====="
        terraform version

        echo
        echo "===== PREPARE TERRAFORM VARIABLES ====="

        SSH_PUBLIC_KEY="$(cat "$(sshPublicKey.secureFilePath)")"

        cat > terraform.tfvars <<TFVARS
location              = "West US 2"
project_name          = "epicbook"
admin_username        = "azureadmin"
ssh_public_key        = "${SSH_PUBLIC_KEY}"
mysql_admin_username  = "$(EPICBOOK_MYSQL_USERNAME)"
mysql_admin_password  = "$(EPICBOOK_MYSQL_PASSWORD)"
vm_size               = "Standard_D2as_v7"
TFVARS

        chmod 600 terraform.tfvars

        echo "Terraform variable file prepared."
        echo "SSH public key loaded from Secure Files."
        echo "MySQL credentials loaded from pipeline variables."

        echo
        echo "===== TERRAFORM INIT ====="
        terraform init -input=false

        echo
        echo "===== TERRAFORM VALIDATE ====="
        terraform validate

        echo
        echo "===== TERRAFORM PLAN ====="
        terraform plan -input=false -out=tfplan

        echo
        echo "===== TERRAFORM APPLY ====="
        terraform apply -input=false -auto-approve tfplan

        echo
        echo "===== EPICBOOK OUTPUTS ====="

        echo "app_public_ip:"
        terraform output -raw app_public_ip

        echo
        echo "mysql_fqdn:"
        terraform output -raw mysql_fqdn

        echo
        echo "backend_private_ip:"
        terraform output -raw backend_private_ip

        echo
        echo "===== CLEANUP ====="
        rm -f terraform.tfvars tfplan

        echo "Temporary Terraform files removed."
