trigger: none

pr: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureServiceConnection: 'epicbook-azure'

steps:
  - checkout: self

  - bash: |
      set -euo pipefail

      echo "===== INSTALL TERRAFORM 1.9.8 ====="

      TERRAFORM_VERSION="1.9.8"
      TERRAFORM_ZIP="terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
      TERRAFORM_URL="https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/${TERRAFORM_ZIP}"

      curl -fsSL "$TERRAFORM_URL" -o "/tmp/${TERRAFORM_ZIP}"

      unzip -o "/tmp/${TERRAFORM_ZIP}" -d /tmp/terraform-install

      sudo install -m 0755 /tmp/terraform-install/terraform /usr/local/bin/terraform

      terraform version
    displayName: 'Install Terraform 1.9.8'

  - task: DownloadSecureFile@1
    name: sshPublicKey
    displayName: 'Download SSH Public Key'
    inputs:
      secureFile: 'epicbook-ssh-public-key.pub'

  - task: AzureCLI@2
    displayName: 'Terraform Init, Plan, Apply and Outputs'
    env:
      EPICBOOK_MYSQL_USERNAME: $(EPICBOOK_MYSQL_USERNAME)
      EPICBOOK_MYSQL_PASSWORD: $(EPICBOOK_MYSQL_PASSWORD)
    inputs:
      azureSubscription: '$(azureServiceConnection)'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      addSpnToEnvironment: true
      inlineScript: |
        set -euo pipefail

        echo "===== AZURE ACCOUNT ====="
        az account show \
          --query '{subscription:name, subscriptionId:id, tenantId:tenantId}' \
          --output table

        export ARM_CLIENT_ID="$servicePrincipalId"
        export ARM_CLIENT_SECRET="$servicePrincipalKey"
        export ARM_TENANT_ID="$tenantId"
        export ARM_SUBSCRIPTION_ID="$(az account show --query id --output tsv)"

        echo
        echo "===== TERRAFORM VERSION ====="
        terraform version

        echo
        echo "===== PREPARE TERRAFORM VARIABLES ====="

        export TF_VAR_location="West US 2"
        export TF_VAR_project_name="epicbook"
        export TF_VAR_admin_username="azureadmin"
        export TF_VAR_ssh_public_key="$(cat "$(sshPublicKey.secureFilePath)")"
        export TF_VAR_mysql_admin_username="$EPICBOOK_MYSQL_USERNAME"
        export TF_VAR_mysql_admin_password="$EPICBOOK_MYSQL_PASSWORD"
        export TF_VAR_vm_size="Standard_D2as_v7"

        echo "Terraform variables prepared."
        echo "SSH public key loaded from Secure Files."
        echo "MySQL credentials loaded as protected pipeline variables."

        echo
        echo "===== TERRAFORM INIT ====="
        terraform init -input=false

        echo
        echo "===== TERRAFORM VALIDATE ====="
        terraform validate

        echo
        echo "===== TERRAFORM PLAN ====="
        terraform plan -input=false -out=tfplan

        echo
        echo "===== TERRAFORM APPLY ====="
        terraform apply -input=false -auto-approve tfplan

        echo
        echo "===== EPICBOOK OUTPUTS ====="

        echo "app_public_ip:"
        terraform output -raw app_public_ip

        echo
        echo "mysql_fqdn:"
        terraform output -raw mysql_fqdn

        echo
        echo "backend_private_ip:"
        terraform output -raw backend_private_ip

        echo
        echo "===== CLEANUP ====="
        rm -f tfplan

        echo "Temporary Terraform plan removed."
